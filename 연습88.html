<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>장애물 피하기 게임</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>
    <h1>장애물 피하기 게임</h1>
    <p>점수: <span id="score">0</span> | 체력: <span id="hp">100</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>
    <p>회색공 : -20     검은공 : -40</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const hpText = document.getElementById("hp");

    let score = 0;
    let hp = 100;
    let gameOver = false;

    const player = {
        x:280,
        y:330,
        width:40,
        height:40,
        speed:6
    };

    function drawPlayer() {
        ctx.fillStyle = "royalblue";
        ctx.fillRect(player.x, player.y, player.width, player.height);
    }
    //drawPlayer();

    const keys = {};

    document.addEventListener("keydown", function (event){
        keys[event.key] = true;
    });
    document.addEventListener("keyup", function (event){
        keys[event.key] = false;
    });

    function movePlayer() {
        if(keys["ArrowLeft"]){
            player.x -= player.speed;
        }
        if(keys["ArrowRight"]){
            player.x += player.speed;
        }
        if(keys["ArrowUp"]){
            player.y -= player.speed;
        } 
        if(keys["ArrowDown"]){
            player.y += player.speed;
        }

        if(player.x < 0) player.x = 0;
        if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        if(player.y < 0) player.y = 0;
        if(player.y + player.height > canvas.height) player.y = canvas.height - player.height;
    }

    const rocks = [];

    function createRock() {
        const rock = {
            x : Math.random() * (canvas.width - 30),
            y : - 30,
            width : 30,
            height : 30,
            speed : Math.random() * 3 + 2,
            damage : 20
        };
        rocks.push(rock);
    }

    function drawRocks() {
        ctx. fillStyle = "gray";

        for(let rock of rocks) {
            ctx.beginPath();
            ctx.arc(
                rock.x + rock.width / 2,
                rock.y + rock.height / 2,
                rock.width / 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    }

    function moveRocks() {
        for(let rock of rocks) {
            rock.y += rock.speed;
        }
        for(let i = rocks.length - 1; i >= 0; i--){
            if(rocks[i].y > canvas.height) {
                rocks.splice(i, 1);
                score++;
                scoreText.textContent = score;
            }
        }
    }

    function checkCollision() {
        for (let i = rocks.length - 1; i >= 0; i--){
            const rock = rocks[i];

            if(player.x < rock.x + rock.width && 
            player.x + player.width > rock.x &&
            player.y < rock.y + rock.height &&
            player.y + player.height > rock.y){
                hp -= rock.damage;

                if(hp < 0) {
                    hp = 0;
                }
                hpText.textContent = hp;
                rocks.splice(i, 1);
                if(hp <= 0){
                    endGame();
                }
            }
        }
    }

    function drawHpBar() {
        ctx.fillStyle = "lightgray";
        ctx.fillRect(20, 20, 200, 20);
        ctx.fillStyle = "limegreen";
        ctx.fillRect(20, 20, hp * 2, 20);
        ctx.strokeStyle = "black";
        ctx.strokeRect(20, 20, 200, 20);
    }

    function endGame() {
        gameOver = true;

        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = "32px Arial";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";

        ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillText("최종 점수:" + score, canvas.width / 2, canvas.height / 2 + 30);
    }

        const rrocks = [];

    function createRRock() {
        const rrock = {
            x : Math.random() * (canvas.width - 30),
            y : - 30,
            width : 30,
            height : 30,
            speed : Math.random() * 10 + 8,
            damage : 40
        };
        rrocks.push(rrock);
    } //추가

    function drawRRocks() {
        ctx. fillStyle = "black";

        for(let rrock of rrocks) {
            ctx.beginPath();
            ctx.arc(
                rrock.x + rrock.width / 2,
                rrock.y + rrock.height / 2,
                rrock.width / 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    } //추가

    function moveRRocks() {
        for(let rrock of rrocks) {
            rrock.y += rrock.speed;
        }
        for(let i = rrocks.length - 1; i >= 0; i--){
            if(rrocks[i].y > canvas.height) {
                rrocks.splice(i, 1);
                score++;
                scoreText.textContent = score;
            }
        }
    } //추가

    function CcheckCollision() {
      for (let i = rrocks.length - 1; i >= 0; i--){
            const rrock = rrocks[i];

            if(player.x < rrock.x + rrock.width && 
            player.x + player.width > rrock.x &&
            player.y < rrock.y + rrock.height &&
            player.y + player.height > rrock.y){
                hp -= rrock.damage;

                if(hp < 0) {
                    hp = 0;
                }
                hpText.textContent = hp;
                rrocks.splice(i, 1);
                if(hp <= 0){
                    endGame();
                }
            }
        }
    } //추가

    function gameLoop() {
        if(gameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        movePlayer();
        moveRocks();
        checkCollision();
        drawHpBar();
        drawPlayer();
        drawRocks();
        drawRRocks(); //추가
        CcheckCollision(); //추가
        moveRRocks(); //추가
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
    setInterval(createRock, 700);
    setInterval(createRRock, 3000); //추가
</script>
</body>

</html>
