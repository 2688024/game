<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #0f1026; /* [수정] 어두운 우주 테마 배경색 적용 */
            color: #ffffff; /* [수정] 글자색을 하얀색으로 변경 */
            margin: 0;
            padding: 20px;
        }

        /* [추가] 상단 HTML5, JS 로고 배지 스타일 */
        .header-logos {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .logo-badge {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .html5 { background: #e34f26; color: white; }
        .js { background: #f7df1e; color: black; }

        /* [추가] 캔버스와 화면 조작키를 묶어줄 컨테이너 */
        .game-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border: 2px solid #2e2f56; /* [수정] 테두리 색상 변경 */
            background: #161738; /* [수정] 어두운 보라/파랑 배경색 적용 */
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); /* [추가] 그림자 효과 */
            border-radius: 8px; /* [추가] 모서리 둥글게 */
        }

        /* [추가] 화면 우측 하단 방향키 버튼 스타일 */
        .controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: grid;
            grid-template-columns: repeat(3, 30px);
            grid-template-rows: repeat(2, 30px);
            gap: 4px;
            opacity: 0.8;
        }
        .btn {
            background: #2b2c54;
            border: 1px solid #484a80;
            color: #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>

<body>

    <!-- [추가] 상단 HTML5 & JS 로고 표시 영역 -->
    <div class="header-logos">
        <span class="logo-badge html5">HTML 5</span>
        <span class="logo-badge js">JS</span>
    </div>

    <h1>뱀 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <!-- [수정] 안내 문구에 일시정지 키 추가 -->
    <p>조작: 방향키 ↑ ↓ ← → | 일시정지: 스페이스바(Space)</p>
    
    <!-- [추가] 난이도 선택 드롭다운 및 게임 시작 버튼 -->
    <p>
        난이도: 
        <select id="difficultySelect">
            <option value="300">쉬움 (Slow)</option>
            <option value="150" selected>보통 (Normal)</option>
            <option value="80">어려움 (Fast)</option>
        </select>
        <button id="startBtn" style="padding: 5px 12px; margin-left: 8px; cursor: pointer;">게임 시작</button>
    </p>

    <!-- [수정] 캔버스 외부를 game-container로 감싸고 우측 하단 버튼 UI 추가 -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="btn btn-up">▲</div>
            <div class="btn btn-left">◀</div>
            <div class="btn btn-down">▼</div>
            <div class="btn btn-right">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x:10, y:10}];

        let food = {x:5, y:5};

        let dx = 1; // 1:오른쪽, -1:왼쪽, 0:이동없음
        let dy = 0; // 1:아래쪽, -1:위쪽, 0:이동없음

        let nextDx = 1;
        let nextDy = 0;

        // [추가] 게임 진행 및 속도 관리를 위한 상태 변수들
        let isStarted = false;    // 게임 시작 여부 (true/false)
        let gameOver = false;
        let isPaused = false;     // 일시정지 상태 여부 (true/false)
        let gameInterval = null; // 타이머(setInterval) 저장용 변수
        let gameSpeed = 150;     // 난이도별 게임 속도 (ms 단위)

        // [추가] 배경 격자(Grid)선 그리기 함수
        function drawGrid() {
            ctx.strokeStyle = "#20224a";
            ctx.lineWidth = 1;

            for (let i = 0; i <= canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        // [수정] 뱀 마디를 둥글게 표현하고 진행 방향에 따른 눈을 그려주는 함수로 개편
        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                const px = snake[i].x * gridSize;
                const py = snake[i].y * gridSize;

                if (i === 0) {
                    // 머리 (밝은 연두색 + roundRect로 둥근 모서리 표현)
                    ctx.fillStyle = "#76ff03";
                    ctx.beginPath();
                    ctx.roundRect(px, py, gridSize - 2, gridSize - 2, 6);
                    ctx.fill();

                    // [추가] 이동 방향(dx, dy)에 맞춰 머리에 눈 위치 계산 후 그리기
                    ctx.fillStyle = "#000";
                    let eyeX = px + 10;
                    let eyeY = py + 10;

                    if (dx === 1) { eyeX = px + 13; eyeY = py + 5; }
                    else if (dx === -1) { eyeX = px + 5; eyeY = py + 5; }
                    else if (dy === 1) { eyeX = px + 12; eyeY = py + 13; }
                    else if (dy === -1) { eyeX = px + 12; eyeY = py + 5; }

                    ctx.beginPath();
                    ctx.arc(eyeX, eyeY, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 몸통 (녹색 + 약한 둥근 모서리)
                    ctx.fillStyle = "#64dd17";
                    ctx.beginPath();
                    ctx.roundRect(px, py, gridSize - 2, gridSize - 2, 4);
                    ctx.fill();
                }
            }
        }

        // [수정] 네모 형태에서 원형 빨간 사과와 초록 잎사귀로 변경
        function drawFood() {
            const px = food.x * gridSize;
            const py = food.y * gridSize;
            const radius = (gridSize - 2) / 2;

            // [추가] 빨간 사과 몸통 (원형)
            ctx.fillStyle = "#ff3344";
            ctx.beginPath();
            ctx.arc(px + gridSize / 2, py + gridSize / 2, radius, 0, Math.PI * 2);
            ctx.fill();

            // [추가] 초록색 잎사귀
            ctx.fillStyle = "#4caf50";
            ctx.fillRect(px + gridSize / 2, py + 2, 3, 4);
        }

        document.addEventListener("keydown", changeDirection);

        // [수정] 키 입력 처리 함수 (시작 전 차단 및 스페이스바 일시정지 추가)
        function changeDirection(event) {
            // [추가] 게임이 시작되지 않았다면 모든 키 입력 무시
            if (!isStarted) return;

            // [추가] 스페이스바 누르면 일시정지 상태 반전(Toggle)
            if (event.code === "Space") {
                if (!gameOver) {
                    isPaused = !isPaused;
                }
                return;
            }

            // [추가] 일시정지 중일 때는 방향키 이동을 막음
            if (isPaused) return;

            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }
            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }
            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }
            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreText.textContent = score;
                moveFood();
            } else {
                snake.pop();
            }
        }

        function moveFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || 
                head.x >= tileCount || 
                head.y < 0 ||
                head.y >= tileCount) {
                endGame();
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText("점수 : " + score, canvas.width / 2, canvas.height / 2 + 30);
        }

        // [수정] 게임 상태(시작 전, 일시정지, 게임 진행) 분기 처리 및 격자선 그리기 추가
        function gameLoop() {
            if (gameOver) return;

            // [추가] 1. 게임 시작 전 대기 화면 연출
            if (!isStarted) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid();

                ctx.font = "bold 16px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText("난이도를 선택 후 [게임 시작]을 누르세요", canvas.width / 2, canvas.height / 2);
                return;
            }

            // [추가] 2. 일시정지 상태 화면 연출
            if (isPaused) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = "bold 28px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.fillText("일시 정지", canvas.width / 2, canvas.height / 2);
                return;
            }

            // 3. 정상 게임 진행
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawGrid(); // [추가] 배경격자선 그리기
            moveSnake();
            checkCollision();
            drawSnake();
            drawFood();
        }

        // [추가] 난이도 드롭다운 및 게임 시작 버튼 이벤트 핸들러
        const difficultySelect = document.getElementById("difficultySelect");
        const startBtn = document.getElementById("startBtn");

        // [추가] [게임 시작] 버튼 클릭 시 선택된 속도로 게임 타이머 실행
        startBtn.addEventListener("click", function() {
            gameSpeed = parseInt(difficultySelect.value); // 선택된 속도값 가져오기
            isStarted = true;                             // 게임 시작 상태로 변경
            isPaused = false;                            // 일시정지 해제
            
            this.blur(); // 버튼에서 포커스를 빼서 스페이스바 입력 시 버튼이 다시 눌리는 현상 방지

            // 기존 타이머 제거 후 새 속도로 루프 가동
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        });

        // [수정] 기존 setInterval 삭제 후, 시작 대기 화면 1회 출력용으로 호출
        gameLoop();
    </script>

</body>

</html>
